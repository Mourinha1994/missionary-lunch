services:
  mongo:
    image: mongo:7
    container_name: missionary-lunch-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" localhost:27017/test",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo-replica-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mongosh --host mongo --quiet --eval "
          try {
            rs.status();
          } catch (error) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'localhost:27017' }]
            });
          }
        "

volumes:
  mongo-data:
